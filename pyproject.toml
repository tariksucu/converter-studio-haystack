[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "converter-studio-haystack"
dynamic = ["version"]
description = "Haystack components for Converter Studio: turn scanned PDFs, images, Office files and e-books into Documents (with OCR), or convert files to PDF, JPG, MP3 and 60 other formats."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Converter Studio", email = "support@converter.studio" }]
keywords = [
  "haystack",
  "haystack-ai",
  "converter-studio",
  "document-converter",
  "ocr",
  "pdf",
  "rag",
  "file-conversion",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["haystack-ai>=2.20,<4", "converter-studio>=1.0,<2", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://converter.studio"
Documentation = "https://converter.studio/developers"
Source = "https://github.com/tariksucu/converter-studio-haystack"
Issues = "https://github.com/tariksucu/converter-studio-haystack/issues"
Changelog = "https://github.com/tariksucu/converter-studio-haystack/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "build>=1.2", "twine>=6.1"]

[tool.hatch.version]
path = "src/haystack_integrations/components/converters/converter_studio/_version.py"

# haystack_integrations is a namespace package shared by every Haystack integration: this wheel
# only adds the converter_studio folder to it.
[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.build.targets.sdist]
include = ["src/haystack_integrations", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
# Every log call really runs (Haystack's logger turns keyword arguments into record fields).
log_level = "DEBUG"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "S", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

# Haystack's convention: `api_key: Secret = Secret.from_env_var(...)` (an immutable value).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["haystack.utils.Secret.from_env_var"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
