name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install the package and its development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Ruff (lint)
        run: 'ruff check .'

      - name: Ruff (format)
        run: 'ruff format --check .'

      - name: Mypy (strict)
        run: 'mypy'

      - name: Build and check the distributions
        run: |
          python -m build
          twine check --strict dist/*

  test:
    name: Tests (Python ${{ matrix.python-version }}, Haystack ${{ matrix.haystack }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        haystack: ['latest']
        include:
          # The oldest Haystack 2 and 3 releases the package supports, and the last Haystack 2.
          - os: ubuntu-latest
            python-version: '3.12'
            haystack: '2.20.0'
          - os: ubuntu-latest
            python-version: '3.12'
            haystack: '2.29.0'
          - os: ubuntu-latest
            python-version: '3.12'
            haystack: '3.0.0'
          - os: windows-latest
            python-version: '3.14'
            haystack: 'latest'
          - os: macos-latest
            python-version: '3.14'
            haystack: 'latest'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install the package and its development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Install Haystack ${{ matrix.haystack }}
        if: matrix.haystack != 'latest'
        run: 'python -m pip install "haystack-ai==${{ matrix.haystack }}"'

      # Unit tests with a fake API behind a mocked transport: no network, no API key.
      - name: Run tests
        run: 'pytest'
